<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Survivors Game</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FFD700">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      height: 100%;
      touch-action: none; /* 모바일 핀치줌/스크롤 차단 — 게임 드래그 입력만 */
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #orientation-warning {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #111;
      color: #fff;
      z-index: 9999;
      font-size: 20px;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    @media screen and (orientation: portrait) and (max-width: 768px) {
      #orientation-warning {
        display: flex;
      }

      #game-container {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="orientation-warning">
    <div style="font-size: 48px; margin-bottom: 20px;">🔄</div>
    <div style="font-weight: bold; margin-bottom: 10px;">Please rotate to landscape!<br/>가로 모드로 회전해 주세요!</div>
    <div style="font-size: 16px; color: #aaa;">Hold your device sideways for the best experience. / 원활한 플레이를 위해 기기를 가로로 눕혀주세요.</div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="./src/main.ts"></script>
  <script>
// SW cache self-heal — 옛 v1/v2 SW 캐시 잔존 사용자를 위한 1회성 자가 정리.
// 새 index.html 이 도달한 시점에 SW 등록이 있으면 모두 unregister + reload.
// localStorage 키로 1회만 실행. v4 마커가 없는 모든 device 가 다음 진입 시 자동 cleanup.
(function () {
    if (!('serviceWorker' in navigator)) return;
    if (window.top !== window.self) return; // iframe (Poki) skip
    const HEAL_KEY = 'survivors_sw_heal_v4';
    if (localStorage.getItem(HEAL_KEY)) return;
    navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (regs.length === 0) {
            localStorage.setItem(HEAL_KEY, '1');
            return;
        }
        Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
            localStorage.setItem(HEAL_KEY, '1');
            location.reload();
        });
    }).catch(function () { localStorage.setItem(HEAL_KEY, '1'); });
})();

// Service Worker 는 자체 도메인에서만 등록. Poki iframe 환경에서는 skip.
// localhost / 127.0.0.1 (dev 모드) 에서도 skip — vite proxy 와 SW 의 fetch
// 가로채기가 충돌하여 CORS/301 에러 유발 (사용자 device 진단으로 확정).
const isInIframe = window.top !== window.self;
const isLocalDev =
    location.hostname === 'localhost' || location.hostname === '127.0.0.1';
if (!isInIframe && !isLocalDev && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
    });
} else if (isLocalDev && 'serviceWorker' in navigator) {
    // 이미 등록된 SW 잔존 시 자동 정리 (개발자가 prod 빌드 후 dev 로 돌아왔을 때).
    navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (regs.length > 0) {
            Promise.all(regs.map(function (r) { return r.unregister(); }))
                .then(function () { location.reload(); });
        }
    }).catch(function () {});
}
  </script>
</body>

</html>
