<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Survivors Game</title>
  <link rel="manifest" href="/survivors/manifest.json">
  <meta name="theme-color" content="#FFD700">
  <link rel="apple-touch-icon" href="/survivors/icon-192.png">
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      height: 100%;
      touch-action: none; /* 모바일 핀치줌/스크롤 차단 — 게임 드래그 입력만 */
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #orientation-warning {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #111;
      color: #fff;
      z-index: 9999;
      font-size: 20px;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    @media screen and (orientation: portrait) and (max-width: 768px) {
      #orientation-warning {
        display: flex;
      }

      #game-container {
        display: none !important;
      }
    }
  </style>
  <script type="module" crossorigin src="/survivors/assets/index-DbLYtYpz.js"></script>
  <link rel="modulepreload" crossorigin href="/survivors/assets/phaser-BZT6OVkT.js">
  <link rel="modulepreload" crossorigin href="/survivors/assets/bitecs-CnSD3cni.js">
  <link rel="modulepreload" crossorigin href="/survivors/assets/rot-js-C_2N1w7J.js">
</head>

<body>
  <div id="orientation-warning">
    <div style="font-size: 48px; margin-bottom: 20px;">🔄</div>
    <div style="font-weight: bold; margin-bottom: 10px;">Please rotate to landscape!<br/>가로 모드로 회전해 주세요!</div>
    <div style="font-size: 16px; color: #aaa;">Hold your device sideways for the best experience. / 원활한 플레이를 위해 기기를 가로로 눕혀주세요.</div>
  </div>
  <div id="game-container"></div>
  <script>
// Service Worker 는 자체 도메인에서만 등록. Poki iframe 환경에서는 skip.
const isInIframe = window.top !== window.self;
if (!isInIframe && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
    });
}
  </script>
</body>

</html>
