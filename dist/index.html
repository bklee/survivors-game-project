<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Survivors Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
    }

    #orientation-warning {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #111;
      color: #fff;
      z-index: 9999;
      font-size: 20px;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    @media screen and (orientation: portrait) and (max-width: 768px) {
      #orientation-warning {
        display: flex;
      }

      #game-container {
        display: none !important;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BrnfrZTs.js"></script>
</head>

<body>
  <div id="orientation-warning">
    <div style="font-size: 48px; margin-bottom: 20px;">🔄</div>
    <div style="font-weight: bold; margin-bottom: 10px;">가로 모드로 회전해 주세요!</div>
    <div style="font-size: 16px; color: #aaa;">원활한 플레이를 위해 기기를 가로로 눕혀주세요.</div>
  </div>
  <div id="game-container"></div>
</body>

</html>
