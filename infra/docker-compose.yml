version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: survivors-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-survivors}
      POSTGRES_USER: ${POSTGRES_USER:-survivors_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # localhost only (외부 노출 차단). 게임 백엔드 API가 같은 host에서 접근.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-survivors_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_backup:
    image: postgres:16-alpine
    container_name: survivors-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-survivors}
      POSTGRES_USER: ${POSTGRES_USER:-survivors_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?password required}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          echo "[$$ts] Starting backup..."
          pg_dump -h $$POSTGRES_HOST -U $$POSTGRES_USER -d $$POSTGRES_DB \
            | gzip > /backups/dump_$$ts.sql.gz
          echo "[$$ts] Backup written, cleaning old (>7d)..."
          find /backups -name "dump_*.sql.gz" -mtime +7 -delete
          sleep 86400
        done

volumes:
  postgres_data:
