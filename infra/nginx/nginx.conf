events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # gzip 압축 (정적 자산)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/wasm;
    gzip_min_length 1024;

    # API rate limit: 60req/min per IP (analytics 이벤트 폭주 방지)
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

    upstream api_upstream {
        server api:3001;
    }

    # HTTP -> HTTPS redirect + Let's Encrypt challenge
    server {
        listen 80;
        server_name games.blocktalker.co.kr;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name games.blocktalker.co.kr;

        ssl_certificate /etc/letsencrypt/live/games.blocktalker.co.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/games.blocktalker.co.kr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 기본 보안 헤더
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 1m;

        # API (LS webhook 의 X-Signature 헤더 전달 필수)
        location /api/ {
            limit_req zone=api_zone burst=30 nodelay;

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Signature $http_x_signature;
            proxy_read_timeout 30s;
        }

        # PWA 정적 파일 (게임 dist)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            # Service worker 는 캐시 금지
            location = /sw.js {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }

            # manifest 도 짧게
            location = /manifest.webmanifest {
                add_header Cache-Control "no-cache";
            }

            # 빌드 자산 (Vite hash 포함) -- 1년 캐시
            location /assets/ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
